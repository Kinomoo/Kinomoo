<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KimMo — Full-Stack Developer and AI Product Builder">
  <style>
    .mono { font-family: 'Noto Sans CJK TC', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s} .a5{animation-delay:.9s} .a6{animation-delay:1.1s}
    @media (prefers-reduced-motion: reduce) { .draw,.fade { animation: none; } .draw{stroke-dashoffset:0} .fade{opacity:1} }
  </style>

  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="#2A3350" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="#8A99B3" x="48" y="44" font-size="11" letter-spacing="3.5">PORTFOLIO — INDEX Nº 001</text>
    <text class="mono" fill="#8A99B3" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">TAICHUNG, TW — 24.14° N</text>
  </g>
  <g class="fade a2">
    <text fill="#E8ECF7" class="mono" x="46" y="176" font-size="72" letter-spacing="-1">KimMo</text>
  </g>
  <g class="fade a3">
