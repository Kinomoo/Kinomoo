  </g>
  <g class="fade a4">
    <text fill="#5B6B85" class="mono" x="48" y="272" font-size="12.5" letter-spacing="1">focus  ›</text>
    <text fill="#5EEAD4" class="mono" x="128" y="272" font-size="12.5" letter-spacing="1">full-stack systems · AI-integrated products · RAG pipelines · cloud deployment</text>
  </g>
  <g class="fade a5">
    <text fill="#5B6B85" class="mono" x="48" y="298" font-size="12" letter-spacing="0.5">shipped: AI 面試訓練平台（跨校合作，線上服務中）· LINE FRESH 2025 Top 10（前 4.4%）</text>
  </g>
  <line class="draw a5" x1="48" y1="340" x2="952" y2="340" stroke="#2A3350" stroke-width="1"/>
