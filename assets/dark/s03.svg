<svg viewBox="0 0 1000 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="03 — telemetry">
  <style>
    .mono { font-family: 'Noto Sans CJK TC', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s} .a5{animation-delay:.9s} .a6{animation-delay:1.1s}
    @media (prefers-reduced-motion: reduce) { .draw,.fade { animation: none; } .draw{stroke-dashoffset:0} .fade{opacity:1} }
  </style>

  <line class="draw a1" x1="48" y1="42" x2="952" y2="42" stroke="#3A2E22" stroke-width="1"/>
  <g class="fade a2">
    <text class="mono" fill="#D8A86C" x="48" y="30" font-size="13" letter-spacing="2">Nº 03</text>
    <text class="mono" fill="#F3E4C8" x="112" y="30" font-size="13" letter-spacing="4">TELEMETRY</text>
  </g>

</svg>