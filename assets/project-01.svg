<svg viewBox="0 0 1000 173" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project 01: AI 面試訓練系統">
  <style>
    .mono { font-family: 'Noto Sans CJK TC', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s} .a5{animation-delay:.9s} .a6{animation-delay:1.1s}
    @media (prefers-reduced-motion: reduce) { .draw,.fade { animation: none; } .draw{stroke-dashoffset:0} .fade{opacity:1} }
  </style>

<text class="mono fade a1" fill="#6D5BD0" x="4" y="40" font-size="13" letter-spacing="1">01</text><text class="mono fade a1" fill="#1E2333" x="46" y="40" font-size="18">AI 面試訓練系統</text><text class="mono fade a2" fill="#5B6B85" x="46" y="68" font-size="15">跨校技術合作（國立臺灣師範大學）· IETAC 2024 國內競賽第一名 · 線上服務中</text><text class="mono fade a2" fill="#5B6B85" x="46" y="93" font-size="15">研究團隊以此系統申請國科會計畫，並發表於 ICEMT 2025（ACM），本人列名致謝</text><text class="mono fade a2" fill="#5B6B85" x="46" y="118" font-size="15">主動將 17GB 老舊專案重構為 pnpm monorepo，遷移至 GCP，並推動團隊導入 GitHub 協作流程</text><text class="mono fade a3" fill="#8A99B3" x="46" y="147" font-size="12.5" letter-spacing="0.5">TypeScript · Python · GPT-4o · GCP · Docker</text>

</svg>