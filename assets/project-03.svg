<svg viewBox="0 0 1000 148" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project 03: NTRP 社群整合平台">
  <style>
    .mono { font-family: 'Noto Sans CJK TC', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s} .a5{animation-delay:.9s} .a6{animation-delay:1.1s}
    @media (prefers-reduced-motion: reduce) { .draw,.fade { animation: none; } .draw{stroke-dashoffset:0} .fade{opacity:1} }
  </style>

<text class="mono fade a1" fill="#2563EB" x="4" y="40" font-size="13" letter-spacing="1">03</text><text class="mono fade a1" fill="#1E2333" x="46" y="40" font-size="18">NTRP 社群整合平台</text><text class="mono fade a2" fill="#5B6B85" x="46" y="68" font-size="15">獨立開發 · 服務 300+ 用戶 · 穩定運行 4 個月</text><text class="mono fade a2" fill="#5B6B85" x="46" y="93" font-size="15">從需求評估、UI 設計到雲端上線一人完成</text><text class="mono fade a3" fill="#8A99B3" x="46" y="122" font-size="12.5" letter-spacing="0.5">Next.js · PostgreSQL · Prisma · Discord OAuth</text>

